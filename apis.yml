  overlays: []
- aid: easyfence-cn:easyfence-cn-x402-facilitator-api
  name: X402 AI 自助门店 x402 Facilitator API
  description: >-
    A self-hosted x402 facilitator role on the same host - POST /facilitator/verify and POST /facilitator/settle
    with free-form JSON bodies, plus /facilitator/healthz reporting the networks it settles on (base,
    base-sepolia, bsc, bsc-testnet). The store's 402 challenge names it as the facilitator for the BSC
    route; the Base route uses https://x402.org/facilitator. The verify/settle bodies were not exercised
    because they move money.
  humanURL: https://www.easyfence.cn/docs
  baseURL: https://www.easyfence.cn/facilitator
  tags:
  - x402
  - Payments
  - Stablecoins
  - Web3

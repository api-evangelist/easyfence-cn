aid: easyfence-cn
name: X402 AI 自助门店
description: >-
  X402 AI 自助门店 ("X402 AI self-service store") is a single-operator agent-commerce storefront at
  easyfence.cn that sells only to other AI agents: a buyer agent reads the A2A agent card, lists seven
  generated services priced 0.30-2.00 USD per call in /api/catalog, optionally negotiates with the store
  clerk over A2A JSON-RPC at /a2a, and orders at /api/deliver, which answers HTTP 402 with an x402 payment
  requirement (USDC on Base or BSC, mainnet) until an EIP-3009 authorization is presented, then returns the
  deliverable. The store also acts as an ERC-8004 style identity issuer with a public trust registry and
  runs its own x402 facilitator for the BSC route. A FastAPI-generated OpenAPI 3.1.0 is served at
  /openapi.json; no SDKs, terms, support channel or operator identity are published, and payments are
  irreversible.

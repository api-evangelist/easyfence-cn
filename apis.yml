- aid: easyfence-cn:easyfence-cn-a2a-agent
  name: X402 AI 自助门店 A2A Agent
  description: >-
    The store's agent-to-agent surface: an anonymous A2A 0.3 JSON-RPC endpoint the agent card points at,
    where a buyer agent negotiates with the store clerk before ordering. The provider's documented method
    is tasks/send with a text part; tasks/get, tools/list and any other method return JSON-RPC -32601 over
    HTTP 400. No streaming or push notifications. The card is served at the legacy /.well-known/agent.json
    path only and declares seven skills, each carrying price_usd and the tags ai-service, x402, auto-pay.
  humanURL: https://www.easyfence.cn/a2a
  baseURL: https://www.easyfence.cn/a2a
